name: Complete Ye1 publication
on:
  push:
    branches: [ye1-publication-20261105]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ye1-publication-20261105
      - name: Assemble approved files and publish branch
        run: |
          python3 .ye1-publish-stage/assemble.py
          git config user.name "Ye1"
          git config user.email "ye1aikeyan@users.noreply.github.com"
          git add -A
          git commit -m "Publish Ye1 graphical abstract skill"
          git push origin HEAD:ye1-publication-20261105
